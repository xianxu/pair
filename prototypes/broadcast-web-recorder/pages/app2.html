<!doctype html><html><head><meta charset="utf-8"><title>TaskPilot reports</title><script src="/assets/index.global.js"></script></head>
<body class="bg-white p-10"><h1 class="text-3xl font-bold text-indigo-700 mb-4">Reports</h1>
<table class="w-full text-left border"><tbody id="r"></tbody></table>
<script>const r=document.getElementById('r');for(let i=0;i<15;i++){r.insertAdjacentHTML('beforeend',`<tr class="${i%2?'bg-slate-50':''}"><td class="p-2 border">Week ${i+1}</td><td class="p-2 border">${(i*137)%500} tasks</td></tr>`);}</script>
</body></html>
