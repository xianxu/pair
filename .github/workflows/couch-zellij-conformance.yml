name: couch-zellij-conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 16 * * 3"
  pull_request:
    paths:
      - "cmd/internal/launcher/session_quiescence*.go"
      - "cmd/internal/launcher/lifecycle*.go"
      - "cmd/internal/launcher/markers*.go"
      - "cmd/internal/launcher/restart*.go"
      - "cmd/internal/launcher/quit_lifecycle_live_test.go"
      - "cmd/internal/checkpoint/**"
      - "cmd/internal/continuationcmd/**"
      - "cmd/internal/couchcore/continuation*.go"
      - "cmd/internal/couchcore/switchcontext.go"
      - "cmd/internal/couchcore/launch_existing.go"
      - "cmd/internal/couchcmd/continuation*.go"
      - "cmd/internal/couchtty/console_continuation*.go"
      - "cmd/internal/launcher/checkpoint*.go"
      - "cmd/internal/launcher/continuation*.go"
      - "cmd/internal/launcher/createflow.go"
      - "cmd/internal/orientation/**"
      - "cmd/internal/readiness/**"
      - "cmd/internal/pairlifecycle/**"
      - "cmd/internal/pairlifecycletest/**"
      - "cmd/internal/artifactpath/**"
      - "cmd/internal/couchcore/park*.go"
      - "cmd/internal/couchcore/artifactcollision*.go"
      - "Makefile"
      - "Makefile.local"
      - "cmd/internal/launcher/osruntime.go"
      - "cmd/internal/couchcore/couch.go"
      - ".github/workflows/couch-zellij-conformance.yml"
  push:
    branches: [main]
    paths:
      - "cmd/internal/launcher/session_quiescence*.go"
      - "cmd/internal/launcher/lifecycle*.go"
      - "cmd/internal/launcher/markers*.go"
      - "cmd/internal/launcher/restart*.go"
      - "cmd/internal/launcher/quit_lifecycle_live_test.go"
      - "cmd/internal/checkpoint/**"
      - "cmd/internal/continuationcmd/**"
      - "cmd/internal/couchcore/continuation*.go"
      - "cmd/internal/couchcore/switchcontext.go"
      - "cmd/internal/couchcore/launch_existing.go"
      - "cmd/internal/couchcmd/continuation*.go"
      - "cmd/internal/couchtty/console_continuation*.go"
      - "cmd/internal/launcher/checkpoint*.go"
      - "cmd/internal/launcher/continuation*.go"
      - "cmd/internal/launcher/createflow.go"
      - "cmd/internal/orientation/**"
      - "cmd/internal/readiness/**"
      - "cmd/internal/pairlifecycle/**"
      - "cmd/internal/pairlifecycletest/**"
      - "cmd/internal/artifactpath/**"
      - "cmd/internal/couchcore/park*.go"
      - "cmd/internal/couchcore/artifactcollision*.go"
      - "Makefile"
      - "Makefile.local"
      - "cmd/internal/launcher/osruntime.go"
      - "cmd/internal/couchcore/couch.go"
      - ".github/workflows/couch-zellij-conformance.yml"

jobs:
  conformance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zellij
        run: brew install zellij
      - name: Exercise Zellij teardown and continuation seed transport
        run: make test-couch-zellij-live
