name: couch-policy-conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 16 * * 3"
  pull_request:
    paths:
      - "cmd/internal/couchcore/policyresolver*.go"
      - "cmd/internal/couchcore/conformance_live_test.go"
      - "Makefile.local"
      - ".github/workflows/couch-policy-conformance.yml"
  push:
    branches: [main]
    paths:
      - "cmd/internal/couchcore/policyresolver*.go"
      - "cmd/internal/couchcore/conformance_live_test.go"
      - "Makefile.local"
      - ".github/workflows/couch-policy-conformance.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone Ariadne base-layer peer
        run: BOOTSTRAP_CLONE_ONLY=1 ./bootstrap.sh
      - name: Build current Ariadne sdlc
        working-directory: ../ariadne
        run: go build -o "$RUNNER_TEMP/sdlc" ./cmd/sdlc
      - name: Compare Pair consumer with real provider
        run: make test-couch-policy-live SDLC_BIN="$RUNNER_TEMP/sdlc"
