<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Couch web cast</title>
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="annotate.css">
<link rel="stylesheet" href="replay.css">
<link rel="stylesheet" href="drive.css">
<link rel="stylesheet" href="sketch.css">
<script type="module" src="viewer.js"></script>
</head>
<body>
<header class="bar">
  <span id="status" class="status">Connecting…</span>
  <span id="title" class="title"></span>
  <span id="url" class="url"></span>
</header>
<main id="stage" class="stage">
  <div id="box" class="box" hidden>
    <iframe id="page" sandbox="allow-same-origin" title="The cast page" tabindex="-1"></iframe>
    <div id="overlay" class="overlay"><div id="pointer" class="pointer" hidden></div></div>
    <p class="paused-label">Paused</p>
  </div>
  <p id="message" class="message">The page shows here when the cast goes live.</p>
</main>
<footer id="timeline" class="timeline" hidden></footer>
</body>
</html>
